name: Build and publish Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: dsh
  REGISTRY: ghcr.io
  DSH_VERSION: 0.1.6-alpha.2
  DSH_COMMIT: ddefc45fbc7f8e46dd73185e68295696d1297887

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image coordinates
        run: |
          set -eux
          image_repo="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          sha_short="${GITHUB_SHA:0:7}"
          {
            echo "IMAGE_REPO=${image_repo}"
            echo "IMAGE_TAGS=${image_repo}:${DSH_VERSION},${image_repo}:sha-${sha_short},${image_repo}:latest"
          } >> "${GITHUB_ENV}"

      - name: Build image
        run: |
          set -eux
          docker build \
            --pull=false \
            --platform linux/amd64 \
            --build-arg DSH_COMMIT="${DSH_COMMIT}" \
            --build-arg DSH_VERSION="${DSH_VERSION}" \
            --tag "${IMAGE_NAME}:${DSH_VERSION}" \
            .

      - name: Smoke test
        run: |
          set -eux
          docker run --rm "${IMAGE_NAME}:${DSH_VERSION}" --version

      # Secrets are masked in logs, but the login step still avoids `set -x`
      # so the token is never expanded into the trace output.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Tag and push image
        if: github.ref == 'refs/heads/main'
        run: |
          set -eux
          IFS=',' read -ra tags <<< "${IMAGE_TAGS}"
          for tag in "${tags[@]}"; do
            docker tag "${IMAGE_NAME}:${DSH_VERSION}" "${tag}"
          done
          for tag in "${tags[@]}"; do
            docker push "${tag}"
          done

      - name: Export image
        run: |
          set -eux
          mkdir -p dist
          docker save "${IMAGE_NAME}:${DSH_VERSION}" \
            | gzip -9 > "dist/deepseek-harness-${DSH_VERSION}-linux-amd64.tar.gz"
          sha256sum "dist/deepseek-harness-${DSH_VERSION}-linux-amd64.tar.gz" \
            > "dist/deepseek-harness-${DSH_VERSION}-linux-amd64.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deepseek-harness-${{ env.DSH_VERSION }}-linux-amd64
          path: |
            dist/deepseek-harness-${{ env.DSH_VERSION }}-linux-amd64.tar.gz
            dist/deepseek-harness-${{ env.DSH_VERSION }}-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        if: github.ref == 'refs/heads/main'
        run: |
          set -eux
          {
            echo "### Published \`${IMAGE_REPO}\`"
            echo
            echo "Tags pushed for commit \`${GITHUB_SHA}\`:"
            echo
            IFS=',' read -ra tags <<< "${IMAGE_TAGS}"
            for tag in "${tags[@]}"; do
              echo "- \`${tag}\`"
            done
            echo
            echo '```sh'
            echo "docker pull ${IMAGE_REPO}:${DSH_VERSION}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
